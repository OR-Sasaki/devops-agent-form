# main への push で「イメージを焼いて push → terraform apply → デプロイ完了待ち」を行う。
#
# Phase 1 で作った最小版（OIDC 疎通確認だけ）を Phase 4 で拡張したもの。
#
# ⚠️ 順序が重要である（D-009）。
#
#     OIDC で assume → docker build & push（タグ = コミット SHA）
#       → terraform apply -var image_tag=<SHA> → ECS デプロイ完了待ち
#
#   Terraform にイメージタグを所有させるので drift が出ない。そして
#   **デプロイ = terraform apply** になるため、観点1（AWS 設定起因）と
#   観点2（コード起因）が同じ1本のデプロイイベントとして Agent から見える。
#   build を先に置くのは、apply の時点でイメージが実在している必要があるため。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC トークンの発行に必須。これが無いと assume できない
  contents: read

# apply が同時に走ると state のロック待ちで詰まるので直列化する
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.13.0
  # bootstrap 側の ECR リポジトリ名。var.project と同じ規約で決まっている
  ECR_REPOSITORY: devops-agent-form

jobs:
  deploy:
    name: build & apply
    runs-on: ubuntu-latest

    # ⚠️ 短く切らないこと。ALB の作成だけで 3〜5 分、Agent Space の前段に time_sleep 30 秒、
    #    ECS の安定待ちが最大 10 分かかる。初回 apply は 45 リソースを作る。
    timeout-minutes: 45

    # ⚠️ サードパーティ action は必ず完全長のコミット SHA で固定する（D-024）。
    # このジョブは AdministratorAccess のロールを assume するため、
    # タグ参照だとタグの付け替えや配布元の侵害でアカウントを丸ごと奪われる。
    # 更新するときはタグから SHA を引き直し、横のコメントも一緒に直すこと。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AWS_ROLE_ARN が未設定だと configure-aws-credentials が
      # 「認証情報が無い」という分かりにくいエラーで落ちるので、先に潰す（D-020）
      - name: Check AWS_ROLE_ARN is set
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::リポジトリ変数 AWS_ROLE_ARN が未設定です。gh variable set AWS_ROLE_ARN --body <role arn> を実行してください（D-020）。"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # ロール ARN にはアカウント ID が含まれる。Public リポジトリなので直書きしない（D-020）
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}
          # Actions のログも公開されるため、アカウント ID をマスクする。
          # ECR のレジストリ URI にもアカウント ID が入るので、この設定が効いている必要がある。
          mask-aws-account-id: true

      # ARN もアカウント ID もログに出さずに assume の成否だけを見る
      - name: Verify assumed identity
        run: |
          aws sts get-caller-identity > /dev/null
          echo "OIDC assume: OK"

      # ⚠️ docker/login-action は使わない（D-024）。
      #    サードパーティ action を1つ増やすと、SHA で固定すべき依存が1つ増える。
      #    AWS CLI は ubuntu-latest にプリインストール済みなので、これで足りる。
      - name: Log in to Amazon ECR
        id: ecr
        run: |
          set -euo pipefail
          registry_uri="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' --output text)"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${registry_uri%%/*}"
          echo "repository_uri=$registry_uri" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        env:
          REPOSITORY_URI: ${{ steps.ecr.outputs.repository_uri }}
        run: |
          set -euo pipefail
          # ⚠️ --platform linux/amd64 を明示する。
          #    ecs.tf が runtime_platform.cpu_architecture = "X86_64" を固定しているので、
          #    arm64 のイメージを push するとタスクが exec format error で起動しない。
          #    ubuntu-latest は x86_64 なので既定でも一致するが、runner が変わったときに
          #    静かに壊れるより、明示して食い違いで落ちるほうがよい。
          docker build --platform linux/amd64 \
            --tag "$REPOSITORY_URI:$GITHUB_SHA" \
            app
          docker push "$REPOSITORY_URI:$GITHUB_SHA"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/main
        run: terraform init -input=false

      - name: terraform apply
        working-directory: terraform/main
        env:
          CONNECT_GITHUB_TO_AGENTS: ${{ vars.CONNECT_GITHUB_TO_AGENTS }}
          REGISTER_PENTEST_TARGET_DOMAIN: ${{ vars.REGISTER_PENTEST_TARGET_DOMAIN }}
          # ⚠️ リテラル "GITHUB" ではなく認可時に払い出される i- 始まりの ID（D-044）。
          #    アカウント固有で AWS の認証情報が無いと読めないため、リポジトリには置かない（D-020）。
          SECURITY_AGENT_GITHUB_INTEGRATION_ID: ${{ vars.SECURITY_AGENT_GITHUB_INTEGRATION_ID }}
        run: |
          set -euo pipefail

          # ⚠️ 未設定のリポジトリ変数を -var で渡してはいけない。
          #    未設定の変数は空文字として渡ってくるが、空文字は null でも false でもないので
          #    型変換か validation で落ちる。渡さなければ variables.tf の default が効く。
          args=(-input=false -auto-approve -lock-timeout=10m -var "image_tag=${GITHUB_SHA}")

          # Phase 5 で GitHub App の認可を済ませた後に true にする（D-029）。
          # 認可より前に true にすると、存在しない連携を参照して apply が落ちる。
          if [ "${CONNECT_GITHUB_TO_AGENTS}" = "true" ]; then
            args+=(-var "connect_github_to_agents=true")
            # integration ID が無いまま連携を有効にすると、リテラル null が API に届いて
            # 分かりにくいエラーで apply が落ちる。Terraform を起動する前に潰す（D-044）。
            if [ -z "${SECURITY_AGENT_GITHUB_INTEGRATION_ID}" ]; then
              echo "::error::CONNECT_GITHUB_TO_AGENTS=true にはリポジトリ変数 SECURITY_AGENT_GITHUB_INTEGRATION_ID が必要です（D-044）。aws securityagent list-integrations --query 'integrationSummaries[?provider==\`GITHUB\`].integrationId' --output text で取得してください。"
              exit 1
            fi
            args+=(-var "security_agent_github_integration_id=${SECURITY_AGENT_GITHUB_INTEGRATION_ID}")
          fi
          # ペンテストのターゲットドメインを Terraform で登録する（D-038）。
          # 検証トークンは computed 属性から ALB のリスナールールへ直接渡るので、
          # 旧 PENTEST_VERIFICATION_PATH / _TOKEN のリポジトリ変数はもう要らない。
          if [ "${REGISTER_PENTEST_TARGET_DOMAIN}" = "true" ]; then
            args+=(-var "register_pentest_target_domain=true")
          fi

          terraform apply "${args[@]}"

      - name: Wait for the ECS deployment to stabilise
        id: wait
        working-directory: terraform/main
        run: |
          set -euo pipefail
          cluster="$(terraform output -raw ecs_cluster_name)"
          service="$(terraform output -raw ecs_service_name)"
          # 失敗時の診断ステップから参照するので、待つ前に出しておく
          {
            echo "cluster=$cluster"
            echo "service=$service"
          } >> "$GITHUB_OUTPUT"

          # ⚠️ 待ちは必ず有限にする。
          #    サーキットブレーカーと自動ロールバックを無効にしている（D-027）ので、
          #    壊れたイメージを push するとサービスは**永遠に安定しない**。
          #    aws ecs wait services-stable は 15 秒 × 40 回（約 10 分）で諦めて非ゼロを返すが、
          #    それに依存せず timeout も重ねる。
          timeout 780 aws ecs wait services-stable --cluster "$cluster" --services "$service"

      # ⚠️ タスクが起動しないときの原因は見分けがつきにくい（assign_public_ip の指定漏れ /
      #    イメージのアーキテクチャ違い / image_tag の不一致 / 実行ロールの権限不足）。
      #    stoppedReason とサービスイベントさえ取れれば大半はその場で切り分けられるので、
      #    失敗時に必ず吐かせる。
      - name: ECS diagnostics (on failure)
        if: failure()
        env:
          CLUSTER: ${{ steps.wait.outputs.cluster }}
          SERVICE: ${{ steps.wait.outputs.service }}
        run: |
          set +e
          cluster="${CLUSTER:-devops-agent-form}"
          service="${SERVICE:-devops-agent-form}"

          echo "::group::service status"
          aws ecs describe-services --cluster "$cluster" --services "$service" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].{status:status,rollout:rolloutState,reason:rolloutStateReason,desired:desiredCount,running:runningCount,failed:failedTasks}}'
          echo "::endgroup::"

          echo "::group::recent service events"
          aws ecs describe-services --cluster "$cluster" --services "$service" \
            --query 'services[0].events[0:20].[createdAt,message]' --output text
          echo "::endgroup::"

          echo "::group::stopped tasks"
          task_arns="$(aws ecs list-tasks --cluster "$cluster" --service-name "$service" \
            --desired-status STOPPED --query 'taskArns' --output text)"
          if [ -n "$task_arns" ] && [ "$task_arns" != "None" ]; then
            # shellcheck disable=SC2086
            aws ecs describe-tasks --cluster "$cluster" --tasks $task_arns \
              --query 'tasks[].{stoppedReason:stoppedReason,stopCode:stopCode,lastStatus:lastStatus,containers:containers[].{name:name,reason:reason,exitCode:exitCode}}'
          else
            echo "停止したタスクはありません（そもそも起動していない可能性があります）"
          fi
          echo "::endgroup::"

      - name: Summary
        if: always()
        working-directory: terraform/main
        run: |
          set +e
          url="$(terraform output -raw alb_url 2>/dev/null)"
          {
            echo "## deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image tag | \`${GITHUB_SHA}\` |"
            echo "| app | ${url:-（未取得）} |"
          } >> "$GITHUB_STEP_SUMMARY"
