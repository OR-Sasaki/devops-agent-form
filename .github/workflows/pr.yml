# PR に対する検査。app の lint / typecheck / test / build と、
# terraform の fmt / validate / plan（結果を PR にコメント）。
#
# ⚠️ fork からの PR の扱い（D-036）
#
#   このリポジトリは Public なので、誰でも fork から PR を出せる。
#   pull_request イベントの fork 由来の実行には **OIDC トークンもシークレットも渡らない**
#   （GitHub の仕様）。terraform plan のジョブはそこで必ず失敗する。
#
#   失敗すること自体は安全側だが、「CI が常に赤い」が常態化すると Phase 6 の判定が濁る。
#   そこで **AWS が要るジョブだけを同一リポジトリ由来の PR に限定**し、
#   app の検査と terraform の fmt / validate は誰の PR でも走らせる。
#
#   ⚠️ pull_request_target は使わない。fork のコードを書き込み権限つきで走らせることになり、
#      AdministratorAccess のロールを持つこのリポジトリでは危険が大きすぎる。

name: pr

on:
  pull_request:
    branches: [main]

# 既定は読み取りのみ。plan をコメントするジョブでだけ pull-requests: write に上げる。
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.13.0

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app

    # ⚠️ action は完全長のコミット SHA で固定する（D-024）。actions/* も例外にしない。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Dockerfile の node:22-slim と揃える。ずれると「ローカルで通るのに本番で落ちる」が起きる。
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # ⚠️ push はしない。ここでの目的は Dockerfile が壊れていないことの確認だけである。
      #    イメージを ECR に載せるのは main へのマージ後（deploy.yml）で、
      #    「デプロイ = terraform apply」の一本道を崩さない（D-009）。
      - name: docker build (no push)
        run: docker build --platform linux/amd64 --tag devops-agent-form:pr .

  terraform-check:
    name: terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # AWS 認証情報が要らないので fork からの PR でも走る（D-036）。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false にすると S3 バックエンドへ接続せずプロバイダだけ取得する。
      # validate に必要なのはプロバイダのスキーマだけなので、認証情報が要らない。
      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in terraform/bootstrap terraform/main; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  terraform-plan:
    name: terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ⚠️ fork からの PR では OIDC トークンが発行されないので、このジョブは実行しない（D-036）。
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      id-token: write
      contents: read
      pull-requests: write # plan 結果を PR にコメントするため

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check AWS_ROLE_ARN is set
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::リポジトリ変数 AWS_ROLE_ARN が未設定です（D-020）。"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/main
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        working-directory: terraform/main
        env:
          CONNECT_GITHUB_TO_AGENTS: ${{ vars.CONNECT_GITHUB_TO_AGENTS }}
          REGISTER_PENTEST_TARGET_DOMAIN: ${{ vars.REGISTER_PENTEST_TARGET_DOMAIN }}
          # ⚠️ vars ではなく secrets（D-047）。vars は Actions のログでマスクされず、
          #    ステップの env ブロックがログにそのまま展開される。
          SECURITY_AGENT_GITHUB_INTEGRATION_ID: ${{ secrets.SECURITY_AGENT_GITHUB_INTEGRATION_ID }}
          ENABLE_PR_CODE_REVIEW_COMMENTS: ${{ vars.ENABLE_PR_CODE_REVIEW_COMMENTS }}
        run: |
          set -uo pipefail

          # ⚠️ -lock=false にする理由 — plan は state を書かない読み取り専用の操作である。
          #    一方 main への push で走る deploy.yml の apply は 10 分以上ロックを保持しうる。
          #    ロックを取りに行くと、PR の plan が apply の裏で待たされて無意味に落ちる。
          #
          #    image_tag は default を持たない必須変数なので必ず渡す（D-032）。
          #    plan は ECR にイメージが実在するかを確かめないので、未 push の SHA でも通る。

          # ⚠️⚠️ deploy.yml と**同じ変数**を渡すこと（D-046）。⚠️⚠️
          #
          #   渡さないと variables.tf の既定（false）が効き、**実在するリソースを
          #   破棄する plan が出る。** 実際に PR #2 で
          #   「検証済みのターゲットドメインと TXT レコードを destroy する」計画が出た。
          #
          #   これは嘘の差分であって本物の変更ではない。放置すると
          #   「いつもの destroy」を読み飛ばす癖がつき、**本物の1件がそこに埋もれる。**
          #   D-037 が ignore_changes を却下したのとまったく同じ理由である。
          args=(-no-color -input=false -lock=false
                -var "image_tag=${{ github.event.pull_request.head.sha }}")

          # ⚠️ ネストの形まで deploy.yml と揃えること（D-047）。
          #    enable_pr_code_review_comments は connect_github_to_agents の**内側**に置く。
          #    外に出すと、CONNECT=false / ENABLE=true のときに plan だけが値を受け取る。
          #    今は security-agent.tf 側でこの変数が connect の三項演算子の中にしか
          #    現れないため実害は出ないが、**参照が増えた瞬間に plan と apply がずれる。**
          if [ "${CONNECT_GITHUB_TO_AGENTS}" = "true" ]; then
            args+=(-var "connect_github_to_agents=true")
            args+=(-var "security_agent_github_integration_id=${SECURITY_AGENT_GITHUB_INTEGRATION_ID}")
            if [ "${ENABLE_PR_CODE_REVIEW_COMMENTS}" = "true" ]; then
              args+=(-var "enable_pr_code_review_comments=true")
            fi
          fi
          if [ "${REGISTER_PENTEST_TARGET_DOMAIN}" = "true" ]; then
            args+=(-var "register_pentest_target_domain=true")
          fi

          exit_code=0
          terraform plan "${args[@]}" > plan.txt 2>&1 || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          # 常にログにも出す。コメントが投稿できなかったときの逃げ道になる。
          cat plan.txt
          exit 0

      - name: Comment the plan on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        working-directory: terraform/main
        run: |
          set -euo pipefail

          if [ "$EXIT_CODE" = "0" ]; then status="✅ 成功"; else status="❌ 失敗 (exit $EXIT_CODE)"; fi

          # データソースの Reading / Read complete 行は毎回同じで読む価値が無いうえ、
          # 出力の先頭を占めるので落とす。切り詰めで本文が消えるのを避けるため。
          grep -vE '^(data\.|module\.).*: (Reading|Read complete)' plan.txt > body.txt || cp plan.txt body.txt

          # ⚠️ 一番読みたい「Plan: N to add, ...」は出力の**末尾**にある。
          #    切り詰めると真っ先に消えるので、本文とは別に抜き出して先頭へ置く。
          summary="$(grep -E '^(Plan:|No changes|Apply complete|Error:)' plan.txt | head -5 || true)"

          # GitHub のコメントは 65536 文字が上限。plan の出力はリソースが増えると簡単に超える。
          limit=55000
          note=""
          if [ "$(wc -c < body.txt)" -gt "$limit" ]; then
            note="> ⚠️ 出力が長いため先頭 ${limit} バイトで切り詰めています。全文は Actions のログにあります。"
          fi

          {
            echo "### terraform plan (\`terraform/main\`)"
            echo
            echo "commit \`${HEAD_SHA}\` / ${status}"
            echo
            if [ -n "$summary" ]; then
              echo '```'
              echo "$summary"
              echo '```'
              echo
            fi
            # ⚠️ [ -n "$note" ] && echo ... と書くと、note が空のときリスト全体が
            #    非ゼロで終わり、set -e がここでスクリプトを止める。if で書くこと。
            if [ -n "$note" ]; then echo "$note"; echo; fi
            echo "<details><summary>plan の出力</summary>"
            echo
            echo '```terraform'
            head -c "$limit" body.txt
            echo
            echo '```'
            echo
            echo "</details>"
          } > comment.md

          # 同じ PR に何度も push されるたびにコメントが増えるのは読みにくいので、
          # 前回の bot コメントがあれば書き換える。無ければ新規作成にフォールバックする。
          gh pr comment "$PR_NUMBER" --body-file comment.md --edit-last \
            || gh pr comment "$PR_NUMBER" --body-file comment.md

      # コメントを投稿してから、plan の結果でジョブの成否を決める。
      - name: Fail if the plan failed
        if: steps.plan.outputs.exit_code != '0'
        run: |
          echo "::error::terraform plan が失敗しました（exit ${{ steps.plan.outputs.exit_code }}）。PR のコメントを参照してください。"
          exit 1
